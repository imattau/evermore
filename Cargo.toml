[workspace]
resolver = "2"
members = ["apps/evermore-greeter", "apps/evermore-launcher", "apps/evermore-panel", "crates/evermore-agentd", "crates/evermore-blossom-fs", "crates/evermore-common", "crates/evermore-contextd", "crates/evermore-enroll", "crates/evermore-indexd", "crates/evermore-inferd", "crates/evermore-mcp", "crates/evermore-notifyd", "crates/evermore-npack", "crates/evermore-operationsd", "crates/evermore-pam-phone", "crates/evermore-pkcs11", "crates/evermore-settingsd", "crates/evermore-signer", "crates/evermore-sway-ai-bridge", "tools/adapter-training"]

[workspace.package]
edition = "2024"

[patch.crates-io]
eframe = { path = "../egui/crates/eframe" }
