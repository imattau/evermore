# Conventional Evermore desktop bindings and Waybar startup.
# Install Fuzzel from the Arch official repositories.

# Keep floating drawers and review surfaces open, with graphite surfaces
# supplying separation from the desktop instead of a bright window outline.
default_border none
default_floating_border none
# Sway's own default (75x50) silently clamps any resize below it -- confirmed
# live: collapsing a drawer to 40px wide via either `swaymsg resize` or the
# app's own Wayland resize request settled at 75px instead, every time,
# because this is enforced server-side regardless of which end asked for the
# resize. The AI and Nostr drawers collapse to a 40px sliver, so the floor
# has to allow that.
floating_minimum_size 40 x 40

# The eGUI launcher supplies the app grid and fuzzy application search.
# Fuzzel remains available for deterministic dmenu pickers.
# The stock Sway config assigns Super+Space to focus-mode switching; `bindsym`
# here overwrites that binding, same as `$mod+d` below -- `unbindsym` would do
# the same thing but errors out if the base config never bound it in the
# first place (confirmed live: `sway -C` on a minimal base config fails with
# "Could not find binding `Mod4+space`"), so it is deliberately not used.
# Disable Sway's stock Super+D launcher without an unbind warning when the
# user's base config has already removed that default binding.
bindsym $mod+d nop
bindsym $mod+space exec evermore-launcher
# Keep Sway's default Super+L focus-right binding; Ctrl+Alt+L locks the session.
bindsym Ctrl+Alt+l exec swaylock
bindsym XF86MonBrightnessUp exec brightnessctl set +5%
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# The application launcher is a regular eframe window, positioned by Sway.
for_window [app_id="org.evermore.Launcher"] floating enable
for_window [app_id="org.evermore.Launcher"] border none
for_window [app_id="org.evermore.Launcher"] resize set width 900 px
for_window [app_id="org.evermore.Launcher"] resize set height 620 px
for_window [app_id="org.evermore.Launcher"] move position center
# Preserve Sway's default focus-mode toggle on a neighboring shortcut.
bindsym $mod+Tab focus mode_toggle

# Evermore drawers are independent floating windows: the AI chat on the left
# edge (400 px) and the Nostr feed on the right edge (340 px). Each is opened
# by its own binding; vanilla Sway has no animation requirement, so show/hide
# remains immediate and keyboard accessible.
for_window [title="Evermore AI"] floating enable
for_window [title="Evermore AI"] resize set width 400 px
for_window [title="Evermore AI"] resize set height 680 px
for_window [title="Evermore AI"] move position 0 px 0 px
for_window [title="Evermore feed"] floating enable
for_window [title="Evermore feed"] resize set width 340 px
for_window [title="Evermore feed"] resize set height 680 px
# The panel moves itself flush against the right edge of its workspace; Sway
# has no right-anchor rule and `100 ppt` plus `move left` can choose the wrong
# output on a multi-monitor layout.
bindsym $mod+i exec evermore-panel --ai
bindsym $mod+Shift+v exec evermore-panel --ai --capture-clipboard
bindsym $mod+Shift+n exec evermore-panel --nostr-feed
bindsym $mod+Shift+f exec evermore-panel --file-search

# SwayNotificationCenter owns notification history, grouping, and DND.
exec swaync
# Provides graphical authorization prompts for localectl and timedatectl.
exec lxqt-policykit-agent
bindsym $mod+n exec swaync-client -t -sw

# Keep the existing Evermore operation palette on Super+Shift+A; its writes
# still require the normal signed grant and owner approval flow.
bindsym $mod+Shift+a exec evermore-panel --command-palette
