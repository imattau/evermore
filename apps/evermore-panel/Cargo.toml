[package]
name = "evermore-panel"
version = "0.1.0"
edition.workspace = true

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg"] }
evermore-common = { version = "0.1.0", path = "../../crates/evermore-common" }
nostr = "0.45.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
