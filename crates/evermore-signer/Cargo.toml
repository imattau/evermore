[package]
name = "evermore-signer"
version = "0.1.0"
edition.workspace = true

[dependencies]
evermore-common = { version = "0.1.0", path = "../evermore-common" }
linux-keyutils = "0.2.5"
nostr = { version = "0.45.7", features = ["nip44", "os-rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = "0.30.0"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.27.0"
