# systemd-tmpfiles rule for the pre-login profile cache (name + avatar)
# that evermore-greeter reads before any user is logged in -- see
# PROJECT_IDEA.md's Phase 5.5. Install to /usr/lib/tmpfiles.d/ (or apply
# once by hand with `systemd-tmpfiles --create evermore-profiles.conf`).
#
# World-writable + sticky, like /tmp: `evermore-signer set-profile` runs
# as the owning human user (never root), and each user only ever creates
# and writes their own <pubkey-hex> subdirectory here. The sticky bit
# stops one user from deleting or renaming another's. Contents are a
# user's own chosen display name/avatar -- already public by nature
# (the same data a kind:0 event carries), so world-readable is correct,
# not a leak.
#
# Deliberately NOT /var/lib/evermore/profiles: that directory is
# already actively managed as a 0700, root-only secrets store by
# evermore-pkcs11 and evermore-signer's device-identity bootstrap, both
# of which reset it to 0700 unconditionally on every run. A world-
# readable subdirectory nested inside it would get silently re-locked
# the next time either of those happened to run -- verified this is a
# real conflict, not a hypothetical one, while testing on the VM.
d /var/lib/evermore-profiles 1777 root root -
