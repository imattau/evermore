[package]
name = "evermore-launcher"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "evermore-launcher"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["file", "image", "svg"] }
freedesktop-desktop-entry = "0.8.4"
freedesktop-icons = "0.4.0"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5"
zbus = "5.19.0"
