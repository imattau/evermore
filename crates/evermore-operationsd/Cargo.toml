[package]
name = "evermore-operationsd"
version = "0.1.0"
edition.workspace = true

[dependencies]
evermore-common = { version = "0.1.0", path = "../evermore-common" }
evermore-npack = { version = "0.1.0", path = "../evermore-npack" }
base64 = "0.23.1"
hex = "0.4.3"
nostr = { version = "0.45.7", features = ["nip59", "os-rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["formatting"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = "3.5.1"
