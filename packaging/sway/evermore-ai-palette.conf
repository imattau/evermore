# Include this file from the user's Sway config to open the catalogue-backed
# approval proposal palette from any workspace.
for_window [title="Evermore command palette"] floating enable
for_window [title="Evermore command palette"] resize set width 720 px
for_window [title="Evermore command palette"] resize set height 560 px
for_window [title="Evermore command palette"] move position center
bindsym $mod+Shift+a exec evermore-panel --command-palette
