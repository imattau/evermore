[package]
name = "evermore-pkcs11"
version = "0.1.0"
edition.workspace = true

[lib]
# cdylib: homed loads this as a C ABI shared library via p11-kit, not as a
# Rust crate -- there is no Rust caller anywhere in this picture.
crate-type = ["cdylib"]

[dependencies]
rsa = "0.9"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
nostr = { version = "0.45.7", features = ["nip46", "os-rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3.27.0"
